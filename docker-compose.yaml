# version: "3.4"
services:
  redis:
    image: redis
    volumes:
      - ./data/redis:/data
    restart: unless-stopped
  web:
    env_file: "settings.env"
    build: .
    image: pi-air-quality-monitor
    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0"
    environment:
        - REDIS_HOST=redis
        - PORT=8000
    volumes:
      - ./src:/code
    depends_on:
      - "redis"
    ports:
      - "8000:8000"
    restart: unless-stopped
    develop:
      watch:
        - path: ./src
          action: rebuild
        - path: ./settings.env
          action: rebuild
